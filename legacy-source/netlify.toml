[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- Custom domain redirects (must come before the proxy/SPA rules) ---
[[redirects]]
  from = "https://launchpad.xeris.inc/*"
  to = "https://launchpad.xerisweb.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://launchpad.xeris.inc/*"
  to = "https://launchpad.xerisweb.com/:splat"
  status = 301
  force = true

# --- RPC proxy (server-to-server forward, bypasses CORS) ---
# Mirrors the vercel.json rewrites so the app's /rpc and /jsonrpc calls work in prod.
[[redirects]]
  from = "/jsonrpc/*"
  to = "https://rpc.xerisweb.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/jsonrpc"
  to = "https://rpc.xerisweb.com/"
  status = 200
  force = true

[[redirects]]
  from = "/rpc/*"
  to = "https://rpc.xerisweb.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/rpc"
  to = "https://rpc.xerisweb.com/"
  status = 200
  force = true

# --- SPA fallback (must be last) ---
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Security headers (mirrors vercel.json) ---
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://rpc.xerisweb.com https://api.binance.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none';"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
